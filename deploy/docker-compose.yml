# SCPN Phase Orchestrator — Docker Compose Deployment

services:
  spo-server:
    build:
      context: ../
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4); assert json.load(r)['status']=='healthy'"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: "no"
