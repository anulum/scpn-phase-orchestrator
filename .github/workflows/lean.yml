# SCPN Phase Orchestrator — Lean formal proof CI

name: Lean Proofs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lean.yml"
      - "formal/lean/**"
      - "spo-kernel/crates/spo-supervisor/src/projector.rs"
      - "spo-kernel/crates/spo-supervisor/src/regime.rs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lean.yml"
      - "formal/lean/**"
      - "spo-kernel/crates/spo-supervisor/src/projector.rs"
      - "spo-kernel/crates/spo-supervisor/src/regime.rs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-proofs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal/lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Lean toolchain
        env:
          ELAN_ARCHIVE_SHA256: 4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.1/elan-x86_64-unknown-linux-gnu.tar.gz
        run: |
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean proofs
        run: bash ../../tools/check_lean_proofs.sh
