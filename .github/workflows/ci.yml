# SCPN Phase Orchestrator — Continuous integration coordinator

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    uses: ./.github/workflows/ci-static-analysis.yml

  python-quality:
    uses: ./.github/workflows/ci-python-quality.yml

  integration:
    uses: ./.github/workflows/ci-integration.yml

  coverage-assurance:
    needs: [python-quality, integration]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-coverage-assurance.yml

  security-assurance:
    uses: ./.github/workflows/ci-security-assurance.yml

  performance-evidence:
    uses: ./.github/workflows/ci-performance-evidence.yml

  studio-frontend:
    needs: static-analysis
    uses: ./.github/workflows/ci-studio-frontend.yml

  ci-gate:
    if: always()
    needs:
      - static-analysis
      - python-quality
      - integration
      - coverage-assurance
      - security-assurance
      - performance-evidence
      - studio-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every CI category to succeed
        env:
          CATEGORY_RESULTS: ${{ toJSON(needs) }}
        run: python tools/check_ci_category_results.py
