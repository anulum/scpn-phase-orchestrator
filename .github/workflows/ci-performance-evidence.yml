# SCPN Phase Orchestrator — Performance evidence

name: CI · Performance evidence

on:
  workflow_call:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            spo-kernel/target
          key: cargo-benchmark-${{ hashFiles('spo-kernel/Cargo.lock') }}
          restore-keys: cargo-benchmark-
      - run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --require-hashes --no-deps -r requirements/ci-tools.txt
          maturin develop --release -m spo-kernel/crates/spo-ffi/Cargo.toml
          pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
      - run: . .venv/bin/activate && python bench/run_benchmarks.py --json > bench/current.json
      - name: Compare against baseline
        run: . .venv/bin/activate && python bench/compare_baseline.py bench/baseline.json bench/current.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: benchmark-results
          path: bench/current.json
