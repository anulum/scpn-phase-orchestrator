# SCPN Phase Orchestrator — Backend and transport integration

name: CI · Backend and transport integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  julia-backend:
    # Julia must initialise PythonCall before coverage starts its thread tracer.
    # This lane first exercises broad native parity without instrumentation,
    # then measures Python bridge and public contracts after Main is ready.
    # Julia native source coverage remains a separate instrumentation scope.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HYPOTHESIS_PROFILE: ci
      PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Julia depot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.julia
          key: julia-depot-${{ hashFiles('pyproject.toml') }}
          restore-keys: julia-depot-
      - name: Install base + optional Julia backend
        run: |
          pip install --require-hashes --no-deps -r requirements/dev-lock.txt
          pip install --no-deps -e .
          pip install --require-hashes -r requirements/julia-lock.txt
      - name: Warm up Julia runtime (juliapkg resolves Julia + precompiles PythonCall)
        run: python -c "from juliacall import Main; print('Julia ready:', Main is not None)"
      - name: Assert Julia backend is available without coverage
        run: >
          python -c "from scpn_phase_orchestrator.upde._run import AVAILABLE_BACKENDS;
          assert 'julia' in AVAILABLE_BACKENDS, AVAILABLE_BACKENDS;
          print('backends:', AVAILABLE_BACKENDS)"
      - name: Run native-backend parity tests without coverage
        # Rust, Go and Mojo are required in their provisioned lanes below; this
        # Julia-only lane previously skipped these three unavailable owners.
        run: >
          pytest tests/ -k backends -m "not slow" --tb=short -p no:cacheprovider
          --deselect=tests/test_chimera_backends.py::TestRustParity
          --deselect=tests/test_chimera_backends.py::TestGoParity
          --deselect=tests/test_chimera_backends.py::TestMojoParity
      - name: Execute Julia measurement ingress contracts
        run: |
          python - <<'PY'
          from juliacall import Main
          from coverage import Coverage
          import pytest

          assert Main is not None
          arguments = [
              'tests/test_chimera_measurement_inputs.py',
              'tests/test_embedding_measurement_inputs.py',
              'tests/test_entropy_prod_measurement_inputs.py',
              'tests/test_opt_entropy_measurement_inputs.py',
              'tests/test_dimension_backends.py',
              'tests/test_npe_backends.py',
              'tests/test_pid_backends.py',
              'tests/test_poincare_backends.py',
              'tests/test_psychedelic_backends.py',
              'tests/test_recurrence_backends.py',
              'tests/test_transfer_entropy_backends.py',
              'tests/test_twin_confidence_backends.py',
              'tests/test_winding_backends.py',
              'tests/test_delay_backends.py',
              'native-tests/test_upde_runtime_phase_wrapping.py',
              '-m',
              'not slow and not performance',
              '-k',
              '(julia and native_runtime) or JuliaParity or (test_public_divergence_uses_real_backend and julia) or PoincareSectionParity or PhasePoincareParity',
              '--tb=short',
              '--strict-markers',
          ]
          measurement = Coverage(data_file=".coverage.julia", data_suffix=False)
          measurement.start()
          try:
              result = pytest.main(arguments)
          finally:
              measurement.stop()
              measurement.save()
          raise SystemExit(result)
          PY
      - name: Qualify required Julia phase attention runtime
        env:
          SPO_ATTNRES_REQUIRED_BACKENDS: "python,julia"
          COVERAGE_FILE: .coverage.julia
        run: python -m pytest tests/test_attention_residuals_real_runtime.py tests/test_attention_residuals_backends.py --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
      - name: Qualify required Julia basin and coupling-sweep consumers
        env:
          SPO_REQUIRED_BASIN_BACKENDS: "python,julia"
          COVERAGE_FILE: .coverage.julia
        run: python -m pytest tests/test_basin_bifurcation_real_runtime.py tests/test_basin_stability_backends.py tests/test_basin_stability_benchmark.py --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
      - name: Check original native Julia basin contracts and type inference
        run: python -c "from juliacall import Main; Main.include('julia/test_basin_stability.jl')"
      - name: Qualify required Julia chimera public runtime
        env:
          COVERAGE_FILE: .coverage.julia
        run: |
          python -m pytest tests/test_chimera_backends.py tests/test_chimera_real_runtime.py -k julia --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
          python -c "from juliacall import Main; Main.include('julia/test_chimera.jl')"
          python -m benchmarks.chimera_benchmark --parity-gate --sizes 16 --calls 20 --require-backends julia
      - name: Upload Julia bridge coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-julia
          path: .coverage.julia
          include-hidden-files: true
      - name: Generate Julia API documentation
        run: python tools/generate_polyglot_docs.py julia --output build/polyglot-docs
      - name: Upload Julia API documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: polyglot-docs-julia
          path: build/polyglot-docs/julia
          retention-days: 14
  go-backend:
    # The Go accelerator bridges compile each source to a cgo ``c-shared``
    # library that the Python runtime loads via ctypes; their FFI call bodies are
    # outside the coverage matrix. This lane compiles every Go accelerator with
    # the toolchain pinned by go/go.mod so a broken or bit-rotted source is caught
    # in CI (the Python loader contracts themselves run in the standard matrix).
    # Owned by the backend-integration category aggregated by ``ci-gate``.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile every Go accelerator to a c-shared library
        working-directory: go
        run: |
          go mod download
          fail=0
          for src in *.go; do
            case "$src" in *_test.go) continue ;; esac
            if ! go build -buildmode=c-shared -o "lib${src%.go}.so" "$src"; then
              echo "::error file=go/${src}::go build -buildmode=c-shared failed"
              fail=1
            fi
          done
          exit "$fail"
      - name: Check native phase attention Go contracts
        run: |
          go test -count=1 go/attnres.go go/attnres_test.go
          go vet go/attnres.go go/attnres_test.go
      - name: Check native basin Go contracts
        run: |
          go test -count=1 go/basin_stability.go go/basin_stability_test.go
          go vet go/basin_stability.go go/basin_stability_test.go
      - name: Install Python measurement test dependencies
        run: pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
      - name: Execute Go measurement ingress contracts with coverage
        run: |
          pytest tests/test_chimera_measurement_inputs.py tests/test_embedding_measurement_inputs.py tests/test_entropy_prod_measurement_inputs.py tests/test_opt_entropy_measurement_inputs.py tests/test_dimension_backends.py tests/test_npe_backends.py tests/test_pid_backends.py tests/test_poincare_backends.py tests/test_psychedelic_backends.py tests/test_recurrence_backends.py tests/test_transfer_entropy_backends.py tests/test_twin_confidence_backends.py tests/test_winding_backends.py tests/test_delay_backends.py native-tests/test_upde_runtime_phase_wrapping.py -m "not slow and not performance" -k "(go and native_runtime) or GoParity or (test_public_divergence_uses_real_backend and go) or PoincareSectionParity or PhasePoincareParity" --tb=short --strict-markers --cov=scpn_phase_orchestrator --cov-report= --cov-fail-under=0
          mv .coverage .coverage.go
      - name: Qualify required Go phase attention runtime
        env:
          SPO_ATTNRES_REQUIRED_BACKENDS: "python,go"
          COVERAGE_FILE: .coverage.go
        run: python -m pytest tests/test_attention_residuals_real_runtime.py tests/test_attention_residuals_backends.py --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
      - name: Qualify required Go basin and coupling-sweep consumers
        env:
          SPO_REQUIRED_BASIN_BACKENDS: "python,go"
          COVERAGE_FILE: .coverage.go
        run: python -m pytest tests/test_basin_bifurcation_real_runtime.py tests/test_basin_stability_backends.py tests/test_basin_stability_benchmark.py --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
      - name: Qualify required Go chimera public runtime
        env:
          COVERAGE_FILE: .coverage.go
        run: |
          go test -cover go/chimera.go go/chimera_test.go
          go vet go/chimera.go go/chimera_test.go
          python -m pytest tests/test_chimera_backends.py tests/test_chimera_real_runtime.py -k go --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
          python -m benchmarks.chimera_benchmark --parity-gate --sizes 16 --calls 20 --require-backends go
      - name: Upload Go measurement coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-go
          path: .coverage.go
          include-hidden-files: true
      - name: Generate Go API documentation
        run: python tools/generate_polyglot_docs.py go --output build/polyglot-docs
      - name: Upload Go API documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: polyglot-docs-go
          path: build/polyglot-docs/go
          retention-days: 14
  mojo-backend:
    # The Mojo accelerator bridges compile each source to a standalone binary that
    # the Python runtime invokes as a subprocess. This lane installs the pinned
    # Mojo toolchain from PyPI and compiles every Mojo accelerator so a broken or
    # bit-rotted source is caught in CI. Measurement contracts execute the
    # resulting binaries, built for baseline x86-64 to avoid host-specific ISA.
    # The lane is owned by the backend-integration category
    # aggregated by ``ci-gate``.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned Mojo toolchain
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --require-hashes -r requirements/mojo-lock.txt
          mojo --version
      - name: Compile every Mojo accelerator
        run: |
          . .venv/bin/activate
          out="mojo"
          fail=0
          for src in mojo/*.mojo; do
            name="$(basename "$src" .mojo)"
            if ! mojo build "$src" --target-cpu x86-64 -o "$out/${name}_mojo" -Xlinker -lm; then
              echo "::error file=${src}::mojo build failed"
              fail=1
            fi
          done
          exit "$fail"
      - name: Install Python measurement test dependencies
        run: .venv/bin/pip install --require-hashes --no-deps -r requirements/dev-lock.txt && .venv/bin/pip install --no-deps -e .
      - name: Execute Mojo measurement ingress contracts with coverage
        run: |
          .venv/bin/pytest tests/test_chimera_measurement_inputs.py tests/test_embedding_measurement_inputs.py tests/test_entropy_prod_measurement_inputs.py tests/test_opt_entropy_measurement_inputs.py tests/test_dimension_backends.py tests/test_npe_backends.py tests/test_pid_backends.py tests/test_poincare_backends.py tests/test_psychedelic_backends.py tests/test_recurrence_backends.py tests/test_transfer_entropy_backends.py tests/test_twin_confidence_backends.py tests/test_winding_backends.py tests/test_delay_backends.py native-tests/test_upde_runtime_phase_wrapping.py -m "not slow and not performance" -k "(mojo and native_runtime) or MojoParity or (test_public_divergence_uses_real_backend and mojo) or PoincareSectionParity or PhasePoincareParity" --tb=short --strict-markers --cov=scpn_phase_orchestrator --cov-report= --cov-fail-under=0
          mv .coverage .coverage.mojo
      - name: Qualify required Mojo phase attention runtime
        env:
          SPO_ATTNRES_REQUIRED_BACKENDS: "python,mojo"
          COVERAGE_FILE: .coverage.mojo
        run: .venv/bin/python -m pytest tests/test_attention_residuals_real_runtime.py tests/test_attention_residuals_backends.py --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
      - name: Qualify required Mojo basin and coupling-sweep consumers
        env:
          SPO_REQUIRED_BASIN_BACKENDS: "python,mojo"
          COVERAGE_FILE: .coverage.mojo
        run: .venv/bin/python -m pytest tests/test_basin_bifurcation_real_runtime.py tests/test_basin_stability_backends.py tests/test_basin_stability_benchmark.py --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
      - name: Check original Mojo basin request admission and numerical output
        env:
          SPO_REQUIRED_BASIN_BACKENDS: "python,mojo"
        run: .venv/bin/python -m pytest native-tests/test_basin_bifurcation_profiles.py -k test_original_mojo_protocol_or_genuine_owner_absence --strict-markers --tb=short
      - name: Qualify required Mojo chimera public runtime
        env:
          COVERAGE_FILE: .coverage.mojo
        run: |
          .venv/bin/python -m pytest tests/test_chimera_backends.py tests/test_chimera_real_runtime.py -k mojo --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
          .venv/bin/python -m benchmarks.chimera_benchmark --parity-gate --sizes 16 --calls 20 --require-backends mojo
      - name: Upload Mojo measurement coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-mojo
          path: .coverage.mojo
          include-hidden-files: true
      - name: Generate Mojo API documentation
        run: .venv/bin/python tools/generate_polyglot_docs.py mojo --output build/polyglot-docs
      - name: Upload Mojo API documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: polyglot-docs-mojo
          path: build/polyglot-docs/mojo
          retention-days: 14
  hierarchy-transport-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
      - name: Run hierarchy transport boundary smoke tests
        run: |
          pytest tests/test_hierarchy_transport_demos.py tests/test_hierarchy_transport_domainpack_workflow.py \
            --maxfail=1 --tb=short
  rust-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spo-kernel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            spo-kernel/target
          key: cargo-${{ runner.os }}-stable-${{ hashFiles('spo-kernel/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-stable-
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --exclude spo-ffi -- -D warnings
      - name: Generate Rust API documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo clean --doc
          cargo doc --locked --no-deps --workspace
      - name: Upload Rust API documentation
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: polyglot-docs-rust
          path: spo-kernel/target/doc
          retention-days: 14
      - run: cargo test --workspace --exclude spo-ffi
      - name: Install the embedded Python runtime dependencies
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: python -m pip install --require-hashes --no-deps -r requirements/runtime-lock.txt
      # spo-ffi `extension-module` is a default feature; disable it so the
      # test binary can link libpython. Ubuntu-only — macOS and Windows
      # runners exercise the FFI path via the maturin wheel build in
      # ``ffi-test`` instead.
      - if: runner.os == 'Linux'
        run: cargo test -p spo-ffi --no-default-features --lib
  ffi-test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            lockfile: requirements/dev-lock-py311.txt
          - os: ubuntu-latest
            python-version: "3.12"
            lockfile: requirements/dev-lock.txt
          - os: macos-latest
            python-version: "3.11"
            lockfile: requirements/dev-lock-py311.txt
          - os: macos-latest
            python-version: "3.12"
            lockfile: requirements/dev-lock.txt
          - os: windows-latest
            python-version: "3.11"
            lockfile: requirements/dev-lock-windows-ffi-py311.txt
          - os: windows-latest
            python-version: "3.12"
            lockfile: requirements/dev-lock-windows-ffi-py312.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            spo-kernel/target
          key: cargo-ffi-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('spo-kernel/Cargo.lock') }}
          restore-keys: cargo-ffi-${{ runner.os }}-
      - name: Build and test (Unix, lockfile)
        if: runner.os != 'Windows' && matrix.python-version == '3.12'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --require-hashes --no-deps -r requirements/ci-tools.txt
          maturin develop --release -m spo-kernel/crates/spo-ffi/Cargo.toml
          pip install --require-hashes --no-deps -r ${{ matrix.lockfile }} && pip install --no-deps -e .
          pip install --require-hashes --no-deps -r requirements/build-tools.txt
          pytest tests/ native-tests/ -v --tb=short \
            --ignore=tests/test_kuramoto_layer.py \
            --ignore=tests/test_stuart_landau_nn.py \
            --ignore=tests/test_bold.py \
            --ignore=tests/test_reservoir.py \
            --ignore=tests/test_ude_kuramoto.py \
            --ignore=tests/test_inverse.py \
            --ignore=tests/test_oim.py \
            --ignore=tests/test_quantum_bridge_live.py \
            --ignore=tests/test_geometry_walk.py \
            --ignore-glob=tests/test_nn_physics_validation*.py \
            -m "not slow and not performance and not native_runtime" \
            -k "not performance" \
            --cov=scpn_phase_orchestrator --cov-report= --cov-fail-under=0
          pytest tests/test_chimera_backends.py tests/test_chimera_real_runtime.py -k rust --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
          pytest native-tests/test_chimera_boundary.py --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
          pytest tests/test_chimera.py::test_local_order_parameter_uses_backend_when_available --strict-markers --tb=short --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
          python -m benchmarks.chimera_benchmark --parity-gate --sizes 16 --calls 20 --require-backends rust
          pytest tests/test_kernel_runtime.py tests/test_cli_serve.py tests/test_kernel_deployment.py native-tests/test_sindy_runtime_profiles.py native-tests/test_attention_residuals_profiles.py native-tests/test_basin_bifurcation_profiles.py \
            -m native_runtime --strict-markers --tb=short \
            --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
          mv .coverage .coverage.ffi
      - name: Exercise real built-in native loading (Linux, Python 3.12)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          . .venv/bin/activate
          mv .coverage.ffi .coverage
          pytest tests/test_kernel_embedded_profile.py \
            -m native_runtime --strict-markers --tb=short \
            --cov=scpn_phase_orchestrator --cov-append --cov-report= --cov-fail-under=0
          mv .coverage .coverage.ffi
      - name: Upload coverage data (ffi, ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-ffi
          path: .coverage.ffi
          include-hidden-files: true
      - name: Build and test (Unix, lockfile)
        if: runner.os != 'Windows' && matrix.python-version != '3.12'
        run: |
          python -m venv .venv
          . .venv/bin/activate
