# SCPN Phase Orchestrator — Python quality

name: CI · Python quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            lockfile: requirements/dev-lock-py311.txt
          - python-version: "3.12"
            lockfile: requirements/dev-lock.txt
          - python-version: "3.13"
            lockfile: requirements/dev-lock-py313.txt
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (lockfile)
        run: pip install --require-hashes --no-deps -r ${{ matrix.lockfile }} && pip install --no-deps -e .
      - name: Install pinned Studio SDK for the coverage lane
        if: matrix.python-version == '3.12'
        run: pip install --require-hashes --no-deps -r requirements/studio-sdk.txt
      - name: Check Phase-SINDy source, tests and runtime diagnostics
        if: matrix.python-version == '3.12'
        run: make phase-sindy-quality PYTHON=python
      - name: Check complete phase attention source, tests and diagnostics
        run: make attention-residuals-quality PYTHON=python
      - name: Check complete basin and coupling-sweep source, tests and diagnostics
        run: make basin-bifurcation-quality PYTHON=python
      - name: Check complete chimera owners, tests, benchmarks and consumers
        run: make chimera-quality PYTHON=python
      - name: Check ethical-cost source, owning consumers and actual comparisons
        run: make ethical-cost-quality PYTHON=python
      - name: Check connectome source, original consumers and installed comparison
        run: make connectome-quality PYTHON=python
      - name: Check complete dimension APIs, native boundaries and comparisons
        run: make dimension-quality PYTHON=python
      - name: Check public Hodge source, original dispatch tests and diagnostics
        run: >
          python -m mypy --strict --config-file tools/connectome_mypy.ini
          src/scpn_phase_orchestrator/coupling/hodge.py
          src/scpn_phase_orchestrator/coupling/_hodge_validation.py
          native-tests/test_hodge_boundary.py
          tests/test_coupling_hodge.py tests/test_hodge_backends.py
          tests/test_hodge_real_runtime.py tests/test_hodge_benchmark.py
          tests/test_hodge_julia_absence.py
          tests/test_hodge.py tests/test_hodge_algorithm.py
          benchmarks/hodge_benchmark.py
      - name: Check original Hodge numerical and pipeline test documentation
        run: >
          python -m ruff check --isolated --select D
          --config 'lint.pydocstyle.convention="numpy"'
          tests/test_hodge.py tests/test_hodge_algorithm.py
          tests/test_coupling_hodge.py tests/test_hodge_benchmark.py
          tests/test_hodge_julia_absence.py
          native-tests/test_hodge_boundary.py
      - name: Check complete delayed integration owners and diagnostics
        run: |
          files=(src/scpn_phase_orchestrator/upde/delay.py
          src/scpn_phase_orchestrator/experimental/accelerators/upde/_delay_validation.py
          src/scpn_phase_orchestrator/experimental/accelerators/upde/_delay_go.py
          src/scpn_phase_orchestrator/experimental/accelerators/upde/_delay_julia.py
          src/scpn_phase_orchestrator/experimental/accelerators/upde/_delay_mojo.py
          tests/test_delay.py tests/test_delay_backends.py tests/test_delay_benchmark.py
          tests/test_delay_config_validation.py tests/test_delay_measurement_inputs.py
          tests/test_delayed_engine_workflow.py tests/test_delay_real_runtime.py
          tests/test_delay_julia_absence.py
          tests/native_output_fixture/missing_classes_contracts.py
          benchmarks/delay_benchmark.py benchmarks/delayed_benchmark.py)
          python -m mypy --strict --config-file tools/connectome_mypy.ini "${files[@]}"
          python -m ruff check --isolated --select E,F,W,I,UP,B,SIM,N,C4,RET,PTH,D \
            --ignore N803,N806,D105 --config 'lint.pydocstyle.convention="numpy"' "${files[@]}"
          python -m ruff format --check "${files[@]}"
      - name: Qualify the distinct actual JAX chimera model
        run: python -m pytest tests/test_nn_chimera.py --strict-markers --tb=short
      - name: Run tests (with coverage on 3.12)
        run: >
          pytest tests/ -v --tb=short
          --ignore=tests/test_kuramoto_layer.py
          --ignore=tests/test_stuart_landau_nn.py
          --ignore=tests/test_bold.py
          --ignore=tests/test_reservoir.py
          --ignore=tests/test_ude_kuramoto.py
          --ignore=tests/test_inverse.py
          --ignore=tests/test_oim.py
          --ignore=tests/test_quantum_bridge_live.py
          --ignore=tests/test_geometry_walk.py
          --ignore-glob=tests/test_nn_physics_validation*.py
          -m "not slow and not performance and not native_runtime"
          -k "not performance"
          ${{ matrix.python-version == '3.12' && '--cov=scpn_phase_orchestrator --cov-report=term-missing --cov-fail-under=0' || '' }}
      - name: Rename coverage data (test)
        if: matrix.python-version == '3.12'
        run: mv .coverage .coverage.test
      - name: Upload coverage data (test)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-data-test
          path: .coverage.test
          include-hidden-files: true
      - name: Validate notebooks
        if: matrix.python-version == '3.12'
        run: |
          pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
          jupyter nbconvert --execute --to notebook notebooks/*.ipynb --ExecutePreprocessor.timeout=120
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
      - name: Run slow stability tests once
        run: >
          pytest tests/ -v --tb=short
          --ignore=tests/test_kuramoto_layer.py
          --ignore=tests/test_stuart_landau_nn.py
          --ignore=tests/test_bold.py
          --ignore=tests/test_reservoir.py
          --ignore=tests/test_ude_kuramoto.py
          --ignore=tests/test_inverse.py
          --ignore=tests/test_oim.py
          --ignore=tests/test_quantum_bridge_live.py
          --ignore=tests/test_geometry_walk.py
          --ignore-glob=tests/test_nn_physics_validation*.py
          -m slow
  nn-coverage:
    # The slow nn/physics-validation test files are --ignore'd in both the main
    # ``test`` job (``-m "not slow"``) and the ``slow-tests`` job (``-m slow``)
    # because they are slow-running but not slow-MARKED, so they fall through both
    # filters. They fully exercise the nn modules (e.g. test_inverse.py drives
    # nn/inverse.py to 100%), but their coverage was never collected, leaving the
    # nn subsystem artificially low in the merged report. This lane runs exactly
    # those files WITH coverage so the merged coverage reflects reality. The set is
    # split into shards because the whole set under coverage exceeds a single job's
    # wall-clock budget; each shard's coverage data is merged in ``coverage-guard``.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            files: tests/test_inverse.py tests/test_oim.py tests/test_bold.py
          - shard: b
            files: tests/test_reservoir.py tests/test_ude_kuramoto.py tests/test_kuramoto_layer.py tests/test_stuart_landau_nn.py tests/test_nn_chimera.py
          - shard: c
            files: tests/test_nn_physics_validation.py
          - shard: d
            files: tests/test_nn_physics_validation_p7.py tests/test_nn_physics_validation_p8.py tests/test_nn_physics_validation_p9.py tests/test_nn_physics_validation_p10.py tests/test_nn_physics_validation_p11.py tests/test_nn_physics_validation_p12.py tests/test_nn_physics_validation_p13.py
          - shard: e
            files: tests/test_nn_physics_validation_p2.py
          - shard: f
            files: tests/test_nn_physics_validation_p3.py tests/test_nn_physics_validation_p4.py
          - shard: g
            files: tests/test_nn_physics_validation_p5.py tests/test_nn_physics_validation_p6.py
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
      - name: Run nn/physics tests (shard ${{ matrix.shard }}) with coverage
        run: >
          pytest ${{ matrix.files }}
          --tb=short -p no:cacheprovider
          -k "not performance"
          --cov=scpn_phase_orchestrator --cov-report= --cov-fail-under=0
      - name: Rename coverage data (nn shard)
        run: mv .coverage .coverage.nn-${{ matrix.shard }}
      - name: Upload coverage data (nn shard)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-data-nn-${{ matrix.shard }}
          path: .coverage.nn-${{ matrix.shard }}
          include-hidden-files: true
  branch-native-build:
    # One release kernel and one package wheel for every native branch job, so
    # the shards and the profile binder measure the same installed bytes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The compatibility test builds one immutable real historical SDK.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # One exact interpreter for every profile job: the aggregate refuses
          # profiles recorded under different patch releases.
          python-version: "3.12.15"
          cache: pip
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            spo-kernel/target
          key: cargo-ffi-${{ runner.os }}-py3.12-${{ hashFiles('spo-kernel/Cargo.lock') }}
          restore-keys: cargo-ffi-${{ runner.os }}-
      - name: Build the actual kernel and the whole Python package once
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --require-hashes --no-deps -r requirements/ci-tools.txt
          pip install --require-hashes --no-deps -r requirements/build-tools.txt
          pip install --require-hashes --no-deps -r requirements/dev-lock.txt
          pip install --require-hashes --no-deps -r requirements/studio-sdk.txt
          maturin build --release --locked -m spo-kernel/crates/spo-ffi/Cargo.toml --out kernel-wheels
          pip wheel --no-deps --no-build-isolation --wheel-dir package-wheels .
          sha256sum kernel-wheels/*.whl package-wheels/*.whl > native-wheels.sha256
          test "$(wc -l < native-wheels.sha256)" -eq 2
      - name: Share the exact wheels with every native branch job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: branch-native-wheels
          path: |
            kernel-wheels/*.whl
            package-wheels/*.whl
            native-wheels.sha256
          if-no-files-found: error
          retention-days: 7

  branch-native-timing:
    # One immutable timing snapshot per run: every shard schedules from the
    # same measurements. A cache miss is a cold run with an empty snapshot,
    # which still selects every module exactly once.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore the latest measured module durations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-timing/branch-native.json
          key: spo-branch-native-timings-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: spo-branch-native-timings-v1-
      - name: Start cold when no measurement exists
        run: |
          mkdir -p .ci-timing
          test -f .ci-timing/branch-native.json \
            || printf '{"durations": {}, "schema": 1}\n' > .ci-timing/branch-native.json
      - name: Share this run's timing snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: branch-native-timing-snapshot
          path: .ci-timing/branch-native.json
          if-no-files-found: error
          retention-days: 7

  branch-native-shard:
    # The native public-contract selection, split by measured module duration.
    # The selection, markers, Hypothesis profile and branch measurement are
    # those of the single run they replace; branch-coverage proves the shards
    # selected every module exactly once before combining their data.
    needs: [branch-native-build, branch-native-timing]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      HYPOTHESIS_PROFILE: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The compatibility test builds one immutable real historical SDK.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # One exact interpreter for every profile job: the aggregate refuses
          # profiles recorded under different patch releases.
          python-version: "3.12.15"
          cache: pip
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Download the shared kernel and package wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: branch-native-wheels
      - name: Install the shared kernel and the whole Python package
        run: |
          sha256sum --check --strict native-wheels.sha256
          python -m venv .venv
          . .venv/bin/activate
          pip install --require-hashes --no-deps -r requirements/ci-tools.txt
          pip install --require-hashes --no-deps -r requirements/build-tools.txt
          pip install --require-hashes --no-deps -r requirements/dev-lock.txt
          pip install --require-hashes --no-deps -r requirements/studio-sdk.txt
          pip install --no-index --no-deps kernel-wheels/*.whl package-wheels/*.whl
      - name: Prepare genuine installed connectome profiles for the global branch gate
        run: |
          python -m venv .connectome-python-coverage
          .connectome-python-coverage/bin/python -m pip install --require-hashes --no-deps -r requirements/connectome-runtime-lock.txt
          .connectome-python-coverage/bin/python -m pip install --no-index --no-deps package-wheels/*.whl
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements/connectome-hcp-lock.txt
          .connectome-python-coverage/bin/python -m pip check
      - name: Download this run's timing snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: branch-native-timing-snapshot
          path: .ci-timing
      - name: Measure this shard of the native public contracts
        run: |
          . .venv/bin/activate
          mkdir -p .ci-branch-shard
          python -m tools.pytest_shards --ignore tests/test_kuramoto_layer.py --ignore tests/test_stuart_landau_nn.py \
            --ignore tests/test_bold.py --ignore tests/test_reservoir.py \
            --ignore tests/test_ude_kuramoto.py --ignore tests/test_inverse.py \
            --ignore tests/test_oim.py --ignore tests/test_quantum_bridge_live.py \
            --ignore tests/test_geometry_walk.py \
            --ignore 'tests/test_nn_physics_validation*.py' \
            select --shard "${{ matrix.shard }}/4" --timings .ci-timing/branch-native.json \
            --receipt .ci-branch-shard/selection.json > .ci-branch-shard/modules.txt
          mapfile -t modules < .ci-branch-shard/modules.txt
          export COVERAGE_FILE="$PWD/.ci-branch-shard/.coverage"
          python -m pytest "${modules[@]}" --tb=short -p no:cacheprovider \
            -p tools.pytest_timing_plugin --module-timings .ci-branch-shard/timings.json \
            -m "not slow and not performance and not native_runtime" \
            -k "not performance" \
            --cov=scpn_phase_orchestrator --cov-branch --cov-report= --cov-fail-under=0 \
            --junitxml=.ci-branch-shard/public-contracts.junit.xml
      - name: Upload this shard's coverage, selection and timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: branch-native-shard-${{ matrix.shard }}
          path: .ci-branch-shard
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  branch-coverage:
    # Branch instrumentation is heavier than line instrumentation and flips
    # host-sensitive wall-clock performance tests, which is why the main
    # coverage matrix stays line-only. This lane runs the ffi-test selection
    # with performance tests deselected and --cov-branch enabled, then gates
    # the branch rate through tools/coverage_guard_branch_thresholds.json
    # (no-decrease ratchet, fail-closed if the XML carries no branch data).
    # Wider timeout than ffi-test: on CPython 3.12 branch measurement runs on
    # the C tracer (sys.monitoring branch support needs 3.14+), so the suite
    # is markedly slower under branch instrumentation. The dev Hypothesis
    # profile (50 examples) is deliberate: this lane measures coverage, not
    # property-based correctness — the main lanes already run the ci profile
    # (500 examples) — and 500-example properties under the C tracer would
    # dominate the lane's wall clock.
    needs: [branch-native-build, branch-native-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HYPOTHESIS_PROFILE: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The compatibility test builds one immutable real historical SDK.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # One exact interpreter for every profile job: the aggregate refuses
          # profiles recorded under different patch releases.
          python-version: "3.12.15"
          cache: pip
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            spo-kernel/target
          key: cargo-ffi-${{ runner.os }}-py3.12-${{ hashFiles('spo-kernel/Cargo.lock') }}
          restore-keys: cargo-ffi-${{ runner.os }}-
      - name: Download the shared kernel and package wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: branch-native-wheels
      - name: Install the shared kernel and the whole Python package
        run: |
          sha256sum --check --strict native-wheels.sha256
          python -m venv .venv
          . .venv/bin/activate
          pip install --require-hashes --no-deps -r requirements/ci-tools.txt
          pip install --require-hashes --no-deps -r requirements/build-tools.txt
          pip install --require-hashes --no-deps -r requirements/dev-lock.txt
          pip install --require-hashes --no-deps -r requirements/studio-sdk.txt
          pip install --no-index --no-deps kernel-wheels/*.whl package-wheels/*.whl
      - name: Qualify required Rust basin and coupling-sweep consumers
        env:
          SPO_REQUIRED_BASIN_BACKENDS: "python,rust"
        run: .venv/bin/python -m pytest tests/test_basin_bifurcation_real_runtime.py tests/test_bifurcation_dispatch.py tests/test_basin_stability_benchmark.py --strict-markers --tb=short
      - name: Prepare genuine installed connectome profiles for the global branch gate
        run: |
          python -m venv .connectome-python-coverage
          .connectome-python-coverage/bin/python -m pip install --require-hashes --no-deps -r requirements/connectome-runtime-lock.txt
          .connectome-python-coverage/bin/python -m pip install --no-index --no-deps package-wheels/*.whl
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements/connectome-hcp-lock.txt
          .connectome-python-coverage/bin/python -m pip check
      - name: Download every native public-contract shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: branch-native-shard-*
          path: .ci-branch-shards
      - name: Measure actual native public contracts
        run: |
          . .venv/bin/activate
          mkdir -p .ci-branch/native
          export COVERAGE_FILE="$PWD/.ci-branch/native/.coverage"
          mkdir -p .ci-branch/native/shards
          for shard in 1 2 3 4; do
            cp .ci-branch-shards/branch-native-shard-$shard/selection.json .ci-branch/native/shards/selection-$shard.json
            cp .ci-branch-shards/branch-native-shard-$shard/public-contracts.junit.xml \
              .ci-branch/native/shards/public-contracts-$shard.junit.xml
          done
          python -m tools.pytest_shards --ignore tests/test_kuramoto_layer.py --ignore tests/test_stuart_landau_nn.py \
            --ignore tests/test_bold.py --ignore tests/test_reservoir.py \
            --ignore tests/test_ude_kuramoto.py --ignore tests/test_inverse.py \
            --ignore tests/test_oim.py --ignore tests/test_quantum_bridge_live.py \
            --ignore tests/test_geometry_walk.py \
            --ignore 'tests/test_nn_physics_validation*.py' \
            verify --count 4 .ci-branch/native/shards/selection-*.json
          coverage combine --keep --data-file="$COVERAGE_FILE" \
            .ci-branch-shards/branch-native-shard-*/.coverage
          pytest tests/test_kernel_runtime.py tests/test_kernel_embedded_profile.py \
            tests/test_kernel_deployment.py tests/test_cli_serve.py \
            --tb=short -p no:cacheprovider -m native_runtime \
            --cov=scpn_phase_orchestrator --cov-branch --cov-append --cov-report= --cov-fail-under=0 \
            --junitxml=.ci-branch/native/native-runtime.junit.xml
          pytest tests/test_hodge_backends.py tests/test_hodge_real_runtime.py tests/test_coupling_hodge.py tests/test_hodge.py -k rust \
            --strict-markers --tb=short -p no:cacheprovider \
            --cov=scpn_phase_orchestrator --cov-branch --cov-append --cov-report= --cov-fail-under=0
          pytest tests/test_chimera_backends.py tests/test_chimera_real_runtime.py -k rust \
            --strict-markers --tb=short -p no:cacheprovider \
            --cov=scpn_phase_orchestrator --cov-branch --cov-append --cov-report= --cov-fail-under=0
          pytest tests/test_chimera.py::test_local_order_parameter_uses_backend_when_available \
            native-tests/test_chimera_boundary.py native-tests/test_hodge_boundary.py tests/test_nn_chimera.py \
            --strict-markers --tb=short -p no:cacheprovider \
            --cov=scpn_phase_orchestrator --cov-branch --cov-append --cov-report= --cov-fail-under=0
          export SPO_CONNECTOME_PYTHON_PROFILE="$PWD/.connectome-python-coverage/bin/python"
          export SPO_CONNECTOME_RUST_PROFILE="$PWD/.venv/bin/python"
          pytest native-tests/test_branch_profile_package_aliases.py \
            -o addopts= --strict-markers --tb=short -p no:cacheprovider
          pytest tests/test_connectome.py tests/test_connectome_python_fallback.py \
            tests/test_connectome_validation_guards.py tests/test_connectome_measurement_inputs.py \
            tests/test_connectome_real_runtime.py tests/test_connectome_benchmark.py \
            native-tests/test_connectome_runtime_profiles.py \
            -o addopts= --strict-markers --tb=short -p no:cacheprovider \
            --cov=scpn_phase_orchestrator --cov-branch --cov-append --cov-report= --cov-fail-under=0
          export SPO_SINDY_PYTHON_ONLY="$SPO_CONNECTOME_PYTHON_PROFILE"
          python -m pytest native-tests/test_attention_residuals_profiles.py \
            native-tests/test_basin_bifurcation_profiles.py \
            -o addopts= --strict-markers --tb=short -p no:cacheprovider \
            --cov=scpn_phase_orchestrator --cov-branch --cov-append --cov-report= --cov-fail-under=0
      - name: Retain the current release kernel for on-demand Hodge consumers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hodge-current-kernel-wheel
          path: kernel-wheels/*.whl
          if-no-files-found: error
          retention-days: 14
      - name: Build the original pre-AttnRes Rust compatibility artifact
        run: |
          . .venv/bin/activate
          mkdir -p .ci-legacy-kernel/source .ci-branch/native/legacy-kernel-wheels
          git archive b18440e61f651d7bc204ea882dbde7be42b2c7cc spo-kernel \
            | tar -x -C .ci-legacy-kernel/source
          CARGO_TARGET_DIR="$PWD/.ci-legacy-kernel/target" maturin build --release --locked \
            -m .ci-legacy-kernel/source/spo-kernel/crates/spo-ffi/Cargo.toml \
            --out .ci-branch/native/legacy-kernel-wheels
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.ci-legacy-kernel/source/spo-kernel')
          pathlib.Path('.ci-branch/native/legacy-kernel-provenance.json').write_text(json.dumps({
              'git_commit': 'b18440e61f651d7bc204ea882dbde7be42b2c7cc',
              'source_sha256': {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                                for path in sorted(root.rglob('*')) if path.is_file()},
              'wheel_sha256': {str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                               for path in pathlib.Path('.ci-branch/native/legacy-kernel-wheels').glob('*.whl')},
          }, indent=2) + '\n')
          PY
          legacy_wheel="$(find "$PWD/.ci-branch/native/legacy-kernel-wheels" -name '*.whl' -type f)"
          current_wheel="$(find "$PWD/kernel-wheels" -name '*.whl' -type f)"
          test -n "$legacy_wheel" && test -n "$current_wheel"
          echo "SPO_ATTENTION_LEGACY_KERNEL_WHEEL=$legacy_wheel" >> "$GITHUB_ENV"
          echo "SPO_ATTENTION_CURRENT_KERNEL_WHEEL=$current_wheel" >> "$GITHUB_ENV"
      - name: Install Hodge LAPACK runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y liblapack3
          test -r /usr/lib/x86_64-linux-gnu/liblapack.so.3
      - name: Provision original Go, Julia and Mojo branch owners
        run: |
          . .venv/bin/activate
          pip install --require-hashes --no-deps -r requirements/julia-lock.txt
          pip install --require-hashes --no-deps -r requirements/mojo-lock.txt
          asset_root="$(python -c 'import sys; print(sys.prefix + "/lib/python" + str(sys.version_info.major) + "." + str(sys.version_info.minor))')"
          mkdir -p "$asset_root/go" "$asset_root/julia" "$asset_root/mojo"
          for name in attnres basin_stability chimera hodge delay dimension embedding; do
            go -C go build -buildmode=c-shared -o "$asset_root/go/lib${name}.so" "${name}.go"
            cp "julia/${name}.jl" "$asset_root/julia/${name}.jl"
            mojo build "mojo/${name}.mojo" --target-cpu x86-64 \
              -o "$asset_root/mojo/${name}_mojo" -Xlinker -lm
          done
          python -m venv .delay-julia-only
          .delay-julia-only/bin/python -m pip install --require-hashes --no-deps -r requirements/dev-lock.txt
          .delay-julia-only/bin/python -m pip install --require-hashes --no-deps -r requirements/julia-lock.txt
          .delay-julia-only/bin/python -m pip install --no-index --no-deps package-wheels/*.whl
          echo "SPO_BRANCH_ASSET_ROOT=$asset_root" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.prefix) / 'lib' / ('python' + str(sys.version_info.major) + '.' + str(sys.version_info.minor))
          files = sorted(path for folder in ('go', 'julia', 'mojo') for path in (root / folder).iterdir() if path.is_file())
          pathlib.Path('.ci-branch/native/native-assets.json').write_text(json.dumps({
              'files': {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in files},
              'sources': {str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                          for folder, extension in (('go', 'go'), ('julia', 'jl'), ('mojo', 'mojo'))
                          for name in ('attnres', 'basin_stability', 'chimera', 'hodge', 'delay', 'dimension', 'embedding')
                          for path in (pathlib.Path(folder) / (name + '.' + extension),)},
          }, indent=2) + '\n')
          PY
      - name: Append real phase-attention, basin and chimera branch observations
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.ci-branch/native/.coverage
          SPO_ATTNRES_REQUIRED_BACKENDS: "python,rust,go,julia,mojo"
          SPO_REQUIRED_BASIN_BACKENDS: "python,rust,go,julia,mojo"
          SPO_HODGE_ABSENT_PYTHON: ${{ github.workspace }}/.connectome-python-coverage/bin/python
          SPO_CHIMERA_ABSENT_PYTHON: ${{ github.workspace }}/.connectome-python-coverage/bin/python
          SPO_DIMENSION_COVERAGE_PACKAGE_ONLY: "1"
          SPO_DIMENSION_JULIA_ONLY_PYTHON: ${{ github.workspace }}/.delay-julia-only/bin/python
          SPO_DIMENSION_GO_LIB: ${{ env.SPO_BRANCH_ASSET_ROOT }}/go/libdimension.so
          SPO_DIMENSION_MISSING_EXPORT_LIB: ${{ env.SPO_BRANCH_ASSET_ROOT }}/go/libhodge.so
          SPO_DIMENSION_MOJO_EXE: ${{ env.SPO_BRANCH_ASSET_ROOT }}/mojo/dimension_mojo
          SPO_DELAY_JULIA_ONLY_PYTHON: ${{ github.workspace }}/.delay-julia-only/bin/python
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import os, pathlib, shutil
          from juliacall import Main
          from coverage import Coverage
          import pytest

          assert Main is not None
          database = pathlib.Path(os.environ['COVERAGE_FILE'])
          shutil.copyfile(database, database.parent / 'raw-before-polyglot')
          measurement = Coverage(data_file=str(database), data_suffix=False, branch=True)
          measurement.load()
          # Julia initializes before the tracer. Asset-refusal children start
          # their own real measurement after initializing Julia as well.
          measurement.set_option('run:patch', [])
          measurement.start()
          try:
              result = pytest.main([
                  'tests/test_attention_residuals_real_runtime.py',
                  'tests/test_basin_bifurcation_real_runtime.py',
                  'tests/test_chimera_real_runtime.py',
                  'tests/test_hodge_real_runtime.py',
                  'tests/test_dimension.py',
                  'tests/test_dimension_backends.py',
                  'tests/test_dimension_guards.py',
                  'tests/test_dimension_validation_guards.py',
                  'tests/test_dimension_measurement_inputs.py',
                  'tests/test_dimension_algorithm.py',
                  'tests/test_dimension_stability.py',
                  'tests/test_dimension_benchmark.py',
                  'tests/test_prop_lyapunov_dimension.py',
                  'tests/test_dimension_real_runtime.py',
                  'tests/test_dimension_sampling.py',
                  'tests/test_dimension_native_absence.py',
                  'native-tests/test_dimension_boundary.py',
                  'tests/test_delay.py',
                  'tests/test_delay_backends.py',
                  'tests/test_delay_benchmark.py',
                  'tests/test_delay_real_runtime.py',
                  'tests/test_delay_julia_absence.py',
                  'tests/test_embedding.py',
                  'tests/test_embedding_backends.py',
                  'tests/test_embedding_real_runtime.py',
                  'tests/test_embedding_algorithm.py',
                  'tests/test_embedding_measurement_inputs.py',
                  'tests/test_embedding_stability.py',
                  'tests/test_embedding_validation_guards.py',
                  'tests/test_embedding_benchmark.py',
                  'tests/test_hodge_backends.py',
                  'tests/test_coupling_hodge.py',
                  'tests/test_hodge.py',
                  'tests/test_hodge_algorithm.py',
                  'native-tests/test_branch_native_assets.py',
                  'native-tests/test_attention_legacy_kernel.py',
                  # The two child-process profiles build symlinked environments
                  # under basetemp, which this step uploads; their children are
                  # not measured, and they are qualified in the profile lanes.
                  '--deselect', 'tests/test_embedding_real_runtime.py::test_python_only_profile_refuses_absent_owners',
                  '--deselect', 'tests/test_embedding_real_runtime.py::test_rust_only_profile_owns_embedding_and_searches',
                  '-m', 'not performance',
                  '-o', 'addopts=', '--strict-markers', '--tb=short',
                  '-p', 'no:cacheprovider',
                  '--basetemp', '.ci-branch/native/owning-pytest',
                  '--junitxml', '.ci-branch/native/polyglot-owning.junit.xml',
              ])
          finally:
              measurement.stop()
              measurement.save()
          if result:
              raise SystemExit(result)
          measurement.combine(data_paths=[str(database.parent)], strict=True, keep=True)
          measurement.save()
          PY
      - name: Compare all required Hodge public runtimes
        run: |
          . .venv/bin/activate
          status=0
          python -m benchmarks.hodge_benchmark --parity-gate --sizes 8 --calls 3 \
            --require-backends python rust go julia mojo > .ci-branch/native/hodge-comparison.json || status=$?
          cat .ci-branch/native/hodge-comparison.json
          exit "$status"
      - name: Compare all required delayed integration runtimes
        run: |
          . .venv/bin/activate
          python -m benchmarks.delay_benchmark --parity-gate --n 16 --n-steps 80 --calls 3 \
            --require-backends python rust go julia mojo --output .ci-branch/native/delay-comparison.json
      - name: Compare all required public dimension owners
        run: |
          . .venv/bin/activate
          python -m benchmarks.dimension_benchmark --parity-gate --T-list 16 --calls 2 \
            --require-backends python rust go julia mojo --output .ci-branch/native/dimension-comparison.json
      - name: Bind the completed genuine native branch profile
        run: |
          . .venv/bin/activate
          python -m tools.branch_coverage_profiles record \
            --profile native --revision "$GITHUB_SHA" --database "$PWD/.ci-branch/native/.coverage" \
            --absent-interpreter "$PWD/.connectome-python-coverage/bin/python" \
            --output .ci-branch/native/profile.json
      - name: Upload actual native branch data and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: branch-profile-native
          path: .ci-branch/native
          include-hidden-files: true
          if-no-files-found: error

  branch-native-timings:
    # Feed this run's measured durations to later runs. Timings decide only
    # where a module runs, never whether it runs.
    needs: [branch-native-timing, branch-native-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"
      - name: Download the snapshot and every shard's timings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: branch-native-*
          path: .ci-timing-inputs
      - name: Record the next timing snapshot from actual durations
        run: |
          mkdir -p .ci-timing
          python -m tools.pytest_shards --ignore tests/test_kuramoto_layer.py --ignore tests/test_stuart_landau_nn.py \
            --ignore tests/test_bold.py --ignore tests/test_reservoir.py \
            --ignore tests/test_ude_kuramoto.py --ignore tests/test_inverse.py \
            --ignore tests/test_oim.py --ignore tests/test_quantum_bridge_live.py \
            --ignore tests/test_geometry_walk.py \
            --ignore 'tests/test_nn_physics_validation*.py' \
            record --previous .ci-timing-inputs/branch-native-timing-snapshot/branch-native.json \
            --output .ci-timing/branch-native.json \
            .ci-timing-inputs/branch-native-shard-*/timings.json
      - name: Keep the measurement for later runs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-timing/branch-native.json
          key: spo-branch-native-timings-v1-${{ github.run_id }}-${{ github.run_attempt }}
