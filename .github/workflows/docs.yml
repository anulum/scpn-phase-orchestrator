# SCPN Phase Orchestrator — Documentation deployment

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "src/**/*.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "src/**/*.py"
      - ".github/workflows/docs.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - run: pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
      - run: pip install --require-hashes --no-deps -r requirements/docs-tools.txt
      - name: Build hosted WASM demo bundle
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked
          cd spo-kernel
          wasm-pack build crates/spo-wasm --target web --out-dir ../../../docs/wasm-pkg
      - run: mkdocs build --strict

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - run: pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
      - run: pip install --require-hashes --no-deps -r requirements/docs-tools.txt
      - name: Build hosted WASM demo bundle
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked
          cd spo-kernel
          wasm-pack build crates/spo-wasm --target web --out-dir ../../../docs/wasm-pkg
      - run: mkdocs gh-deploy --force --strict
