# SCPN Phase Orchestrator — Static analysis

name: CI · Static analysis

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - name: Check the policy fuzzer and its runtime contracts
        run: |
          ruff check fuzzers/policy_yaml_fuzzer.py fuzzers/test_policy_yaml_runtime.py
          ruff format --check fuzzers/policy_yaml_fuzzer.py fuzzers/test_policy_yaml_runtime.py
      - run: >
          interrogate src/scpn_phase_orchestrator
          --fail-under 100
          --ignore-init-method
          --ignore-magic
          --exclude src/scpn_phase_orchestrator/runtime/grpc_gen
          --quiet
      - run: python tools/check_version_sync.py
      - run: python tools/capability_manifest.py --check
      - run: python tools/build_studio_panel_data.py --check
      - run: python tools/check_spdx_headers.py
      - run: python tools/audit_ci_workflow_modularity.py
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
      - run: mypy --strict --explicit-package-bases src/scpn_phase_orchestrator/ tools/
      - name: Strictly check the domainpack runners
        run: mypy --strict domainpacks/
      - name: Hold the test-suite strict typing ratchet
        run: python tools/tests_typing_ratchet.py
      - name: Strictly check the policy fuzz runtime boundary
        run: >
          python -m mypy --strict --config-file tools/connectome_mypy.ini
          fuzzers/policy_yaml_fuzzer.py fuzzers/test_policy_yaml_runtime.py
  module-linkage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
      - run: python tools/check_product_boundaries.py
      - run: python tools/check_test_module_linkage.py
