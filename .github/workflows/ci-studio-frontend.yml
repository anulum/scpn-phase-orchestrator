# SCPN Phase Orchestrator — Studio frontend

name: CI · Studio frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  studio-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck (TS strict)
        run: pnpm typecheck
      - name: Test with enforced coverage thresholds
        run: pnpm test:coverage
      - name: Build the portal and the federation remote
        run: pnpm build
      - name: Assert the ESM remote entry carries the federation name
        run: |
          test -f dist/remoteEntry.js
          grep -q "scpn_phase_orchestrator" dist/remoteEntry.js

  studio-web-audit:
    # Checks every package of the committed lock against the advisory
    # database, the check a Dependabot security update performs, repeated at
    # the current head. It reads the lock only and needs no install. Any
    # advisory, in a production or a development dependency, fails the job; a
    # registry error fails it too, because an unanswered audit is not a pass.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - name: Audit the locked dependencies for known vulnerabilities
        run: pnpm audit
