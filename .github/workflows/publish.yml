# SCPN Phase Orchestrator — Publish to PyPI

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-publish CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - run: pip install --require-hashes --no-deps -r requirements/dev-lock.txt && pip install --no-deps -e .
      - run: python tools/check_github_action_refs.py .github/workflows/publish.yml
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ruff check src/ tests/
      - name: Run release preflight tests
        timeout-minutes: 25
        run: >
          pytest tests/ -x -vv --tb=short --durations=25
          --ignore=tests/test_kuramoto_layer.py
          --ignore=tests/test_stuart_landau_nn.py
          --ignore=tests/test_bold.py
          --ignore=tests/test_reservoir.py
          --ignore=tests/test_ude_kuramoto.py
          --ignore=tests/test_inverse.py
          --ignore=tests/test_oim.py
          --ignore=tests/test_quantum_bridge_live.py
          --ignore=tests/test_geometry_walk.py
          --ignore-glob=tests/test_nn_physics_validation*.py
          -m "not slow and not performance"
          -k "not performance"
      - run: python tools/check_version_sync.py
      - run: python tools/check_release_tag_version.py
      - run: python tools/check_meta_distribution.py
      - run: cargo clippy --workspace --exclude spo-ffi -- -D warnings
        working-directory: spo-kernel
      - run: cargo test --workspace --exclude spo-ffi
        working-directory: spo-kernel

  build-wheels:
    name: Build wheels (${{ matrix.os }}-${{ matrix.target }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            python_interpreter: /opt/python/cp312-cp312/bin/python
          - os: ubuntu-24.04-arm
            target: aarch64
            python_interpreter: /opt/python/cp312-cp312/bin/python
          - os: macos-latest
            target: x86_64
            python_interpreter: python
          - os: macos-latest
            target: aarch64
            python_interpreter: python
          - os: windows-latest
            target: x86_64
            python_interpreter: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Build wheel via maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release -m spo-kernel/crates/spo-ffi/Cargo.toml --out dist -i ${{ matrix.python_interpreter }}
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kernel-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build pure-Python sdist
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/publish-tools.txt
      - run: python tools/build_reproducible_release.py --sdist-only --outdir dist
      - name: Rebuild and compare sdist bytes
        run: |
          python tools/build_reproducible_release.py --sdist-only --outdir dist-recheck
          cmp dist/*.tar.gz dist-recheck/*.tar.gz
      - run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-fallback-wheel:
    name: Build pure-Python wheel (fallback)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/publish-tools.txt
      - run: python tools/build_reproducible_release.py --wheel-only --outdir dist
      - name: Rebuild and compare wheel bytes
        run: |
          python tools/build_reproducible_release.py --wheel-only --outdir dist-recheck
          cmp dist/*.whl dist-recheck/*.whl
      - run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-fallback
          path: dist/*.whl

  publish-pypi:
    name: Publish scpn-phase-orchestrator to PyPI
    needs: [build-sdist, build-fallback-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scpn-phase-orchestrator
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheel-fallback
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  build-container:
    name: Build, scan, and push container image
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless sigstore signing of the image + provenance
      attestations: write  # store the SLSA build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "security_refresh=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/anulum/scpn-phase-orchestrator:${{ steps.meta.outputs.version }}
          build-args: |
            SECURITY_REFRESH_STAMP=${{ steps.meta.outputs.security_refresh }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/anulum/scpn-phase-orchestrator:${{ steps.meta.outputs.version }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan image with Grype
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp:/tmp \
            anchore/grype:v0.82.0 \
            ghcr.io/anulum/scpn-phase-orchestrator:${{ steps.meta.outputs.version }} \
            --scope all-layers \
            --only-fixed \
            --fail-on high \
            -o table

      - name: Push to GHCR
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/anulum/scpn-phase-orchestrator:${{ steps.meta.outputs.version }}
            ghcr.io/anulum/scpn-phase-orchestrator:latest
          build-args: |
            SECURITY_REFRESH_STAMP=${{ steps.meta.outputs.security_refresh }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Attest SLSA build provenance (container image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/anulum/scpn-phase-orchestrator
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the container image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/anulum/scpn-phase-orchestrator@${DIGEST}"

  build-kernel-sdist:
    name: Build spo-kernel sdist
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist via maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -m spo-kernel/crates/spo-ffi/Cargo.toml --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kernel-sdist
          path: dist/*.tar.gz

  publish-spo-kernel:
    name: Publish spo-kernel to PyPI
    needs: [preflight, build-wheels, build-kernel-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi-spo-kernel
      url: https://pypi.org/p/spo-kernel
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: kernel-wheel-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kernel-sdist
          path: dist/
      # skip-existing: the kernel keeps its own version; a main-package tag
      # that does not bump spo-kernel must not fail on the duplicate upload.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
