# SCPN Phase Orchestrator — Pre-commit hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Preserve the exact upstream FUSION evidence bytes and SHA-256.
        exclude: ^tests/fixtures/producer_source/torax_runtime_review_envelope_v1\.json$
      - id: check-yaml
        args: [--unsafe]
        exclude: ^deploy/helm/templates/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix, --no-cache]
        exclude: '^src/scpn_phase_orchestrator/runtime/grpc_gen/spo_pb2(_grpc)?\.py$'
      - id: ruff-format
        args: [--no-cache]
        # ruff 0.16 formats Python code blocks in Markdown and its hook now
        # selects Markdown files. Keep the hook on Python sources, the scope CI
        # formats, so documentation is not rewritten outside a reviewed change.
        types_or: [python, pyi, jupyter]
        exclude: '^src/scpn_phase_orchestrator/runtime/grpc_gen/spo_pb2(_grpc)?\.py$'

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "--quiet"]
        files: ^(src|tests)/
        exclude: '^src/scpn_phase_orchestrator/runtime/grpc_gen/spo_pb2(_grpc)?\.py$'
        additional_dependencies: ["bandit[toml]"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd spo-kernel && cargo fmt --check'
        language: system
        pass_filenames: false
        files: \.rs$

      - id: version-sync
        name: version consistency
        entry: python tools/check_version_sync.py
        language: system
        pass_filenames: false
        files: (pyproject\.toml|CITATION\.cff|Cargo\.toml)

      - id: capability-manifest
        name: capability manifest consistency
        entry: python tools/capability_manifest.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: tracked-ignored
        name: tracked ignored file guard
        entry: python tools/check_tracked_ignored.py
        language: system
        pass_filenames: false
        always_run: true
