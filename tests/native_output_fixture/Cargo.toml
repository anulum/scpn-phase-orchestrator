# SCPN Phase Orchestrator — Native output fault boundary fixture

[package]
name = "spo-native-output-fixture"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
publish = false
description = "Non-publishable native output fault fixture for Python boundary contracts"

[lib]
name = "spo_kernel"
crate-type = ["cdylib"]

[workspace]

[features]
default = ["steppers"]
steppers = []

[dependencies]
pyo3 = { version = "=0.29.2", features = ["extension-module", "abi3-py310"] }
